# SmartTube Hunys — compilare automată / automatic build
# Mod de / by Hunys with Claude AI, bazat pe SmartTube de yuliskov (MIT)
name: Build SmartTube Hunys

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hunys-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Semnare / Signing
        run: |
          echo "storePassword=hunys-smarttube" > keystore.properties
          echo "keyAlias=hunys" >> keystore.properties
          echo "keyPassword=hunys-smarttube" >> keystore.properties
          echo "storeFile=${{ github.workspace }}/hunys/hunys-release.jks" >> keystore.properties

      - name: Compilare / Build
        run: |
          chmod +x gradlew
          ./gradlew assembleSthunysRelease --stacktrace

      - name: Pregătire APK / Prepare APK
        run: |
          mkdir -p out
          cp smarttubetv/build/outputs/apk/sthunys/release/*_armeabi-v7a.apk out/SmartTube-Hunys-armeabi-v7a.apk
          cp smarttubetv/build/outputs/apk/sthunys/release/*_arm64-v8a.apk out/SmartTube-Hunys-arm64-v8a.apk
          ls -la out

      - name: Încarcă artefact / Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartTube-Hunys
          path: out/*.apk

      - name: Publică versiunea / Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete hunys-latest -y --cleanup-tag || true
          gh release create hunys-latest out/*.apk \
            --title "SmartTube Hunys (build ${{ github.run_number }})" \
            --notes "Mod de Hunys with Claude AI, bazat pe SmartTube de yuliskov. Pentru proiector (32 biți): SmartTube-Hunys-armeabi-v7a.apk" \
            --prerelease
